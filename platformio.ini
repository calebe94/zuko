; Zuko (RP2350) — Raspberry Pi Pico 2 guitar preamp / cab simulator

[platformio]
default_envs = rpipico2

[env:rpipico2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
board_build.core = earlephilhower

; --- Clocking -------------------------------------------------------------
; 245.76 MHz, NOT 250 MHz. This value is dictated by the I2S clock tree:
; the RP2350 generates MCLK itself (route B, decided), and every division has to
; be an exact integer -> MCLK = clk_sys / 20 = 12.288 MHz and the bit-clock state
; machine = clk_sys / 40 = 3.072 MHz, with LRCK = 48 kHz counted in that state
; machine. At 250 MHz the division would be fractional (fractional dividers add
; jitter and let the three signals drift against each other).
; This is also a milder overclock than 250 MHz, so it has more stability margin.
; arduino-pico passes this to the core as F_CPU; the core raises the regulator to
; 1.15 V itself when F_CPU > 133 MHz, and src/main.cpp additionally forces 1.20 V
; before re-applying the clock.
board_build.f_cpu = 245760000L
; Fallback if 245.76 MHz is not stable on a given board. This must remain an exact
; multiple of 12.288 MHz or the sample rate moves: 184.32 MHz = 12.288 x 15
; (MCLK = clk_sys / 15, bit-clock state machine = clk_sys / 30).
; board_build.f_cpu = 184320000L

; No LittleFS partition: all 4 MB of flash (Pico 2) stay available to the sketch.
board_build.filesystem_size = 0m

monitor_speed = 115200

; --- Compiler flags -------------------------------------------------------
; -ffast-math is deliberately NOT enabled yet. It lets the compiler reassociate
; and relax tanhf()/expf() edge-case handling; its effect on waveshaper accuracy
; must be measured first.
;
; VERIFIED IN DOCKER, 2026-10-30: the originally specified
; "   -mfloat-abi=hard -mfpu=fpv5-sp-d16" BREAKS the build with this platform.
; The arduino-pico core compiles RP2350 with
;   -mcpu=cortex-m33 -march=armv8-m.main+fp+dsp -mfloat-abi=softfp
; and the toolchain installed for that core ships no hard-float multilib, so the
; C++ headers fail with:  bits/c++config.h: No such file or directory
; (reproduced: exit 1 after 165 s). Without the two flags the build succeeds and
; produces firmware.uf2 (RAM 1.7%, flash 0.9%).
; softfp changes only the calling convention, not the instruction set, so the
; hardware FPU is still used — verified in the linked ELF with objdump.
build_flags =
    -O3
    -DARM_MATH_CM33
    -D__FPU_PRESENT=1U
    -fsingle-precision-constant

; --- Libraries ------------------------------------------------------------
; No version pins: PlatformIO resolves the latest release.
lib_deps =
    teamprof/ArduCMSIS-DSP
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library

; --- Sources --------------------------------------------------------------
; Phase 0: only src/main.cpp (toolchain, clock and dual-core proof).
; Phase 1: DSP, I2S driver and UI sources are added under src/; nothing to
; change here unless a build filter is needed.
; build_src_filter = +<*>
