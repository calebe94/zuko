[preset]
; gain beyond 1.0 is INTENTIONAL: drive maps to 2 + gain*6 per stage, so
; gain = 7.8 -> drive ~49 -> full-crush punk wall. Mathematically safe
; (tanh-bounded, no NaN/clamp). Recommended: 0-1 normal, 1-3 edge, >3 extreme.
model    = jcm800
gain     = 0.80
bass     = 7.0
mid      = 3.0
treble   = 1.0
presence = 0.45
master   = 0.70
