[preset]
; All parameters 0-100: EQ 50 = neutral (-12..+12 dB at the ends),
; presence/master = percent. See host/ini_map.h.
model    = jcm800
gain     = 10
bass     = 79
mid      = 62
treble   = 54
presence = 45
master   = 70
cabsim_taps = 512  ; FIR length: fewer taps = less delay (taps/2 samples), shorter IR tail
