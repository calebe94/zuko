[preset]
; All parameters 0-100: EQ 50 = neutral (-12..+12 dB at the ends),
; presence/master = percent. See host/ini_map.h.
; gain keeps rising past 100 on purpose (tanh-bounded, safe): 100 = drive 50.
; FIR length: fewer taps = less delay (taps/2 samples), shorter IR tail
;
; Dynamics:
;   headroom 0-100 (100 = off): input pad before stage 1, loudness-compensated.
;     Lower = more picking dynamics (soft picking cleans up, hard still roars).
;     Tune DOWN until soft picking cleans up; if the output clips, raise it
;     or lower master.
;   sag 0-100 (0 = off): loud playing temporarily reduces stage-2 drive
;     (tube-sag style) — attack keeps its bite, the sustain opens up.
;   sag_attack_ms / sag_release_ms: envelope ballistics (default 10 / 250).
model    = jcm800
gain     = 70
bass     = 50
mid      = 50
treble   = 70
presence = 60
master   = 50
headroom = 25
sag      = 40
sag_attack_ms = 10
sag_release_ms = 250
cabsim_taps = 528
