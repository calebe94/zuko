[preset]
; All parameters 0-100: EQ 50 = neutral (-12..+12 dB at the ends),
; presence/master = percent. See host/ini_map.h.
; gain keeps rising past 100 on purpose (tanh-bounded, safe): 100 = drive 50.
model    = jcm800
gain     = 50
bass     = 71
mid      = 71
treble   = 79
presence = 45
master   = 70
