[preset]
; All parameters 0-100: EQ 50 = neutral (-12..+12 dB at the ends),
; presence/master = percent. See host/ini_map.h.
; headroom 0-100 (100 = off): input pad = more picking dynamics (see
; jcm800-punk.ini for the full explanation). sag stays off here.
model    = jcm800
gain     = 11
bass     = 58
mid      = 42
treble   = 71
presence = 60
master   = 75
headroom = 35
sag      = 0
sag_attack_ms = 10
sag_release_ms = 250
cabsim_taps = 512  ; FIR length: fewer taps = less delay (taps/2 samples), shorter IR tail
